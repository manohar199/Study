name: Auto-Fix Markdown Math Delimiters

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  clean-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the action to commit fixes back to your repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize and Replace Math Delimiters
        run: |
          python3 -c '
          import os
          import re

          def fix_file(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  content = f.read()

              # 1. Convert block math \... \ or ......... to .........
              content = re.sub(r"\\\[", "", content)
              content = re.sub(r"\\\]", "", content)

              # 2. Convert inline math \... \ or ......... to single .........
              content = re.sub(r"\\\\\(|\\\(", "", content)
              content = re.sub(r"\\\\\)|\\\)", "", content)

              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("Scanning for markdown files to fix...")
          for root, _, files in os.walk("."):
              # Skip hidden folders like .git or .github
              if any(part.startswith(".") for part in root.split(os.sep)):
                  continue
              for file in files:
                  if file.endswith(".md"):
                      path = os.path.join(root, file)
                      print(f"Sanitizing: {path}")
                      fix_file(path)
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          
          # Check if the Python script actually changed any files
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected! Committing repaired files..."
            git commit -am "style: automated fix for GitHub Markdown math delimiters"
            git push
          else
            echo "All markdown files are already perfectly formatted. No actions needed."
          fi
