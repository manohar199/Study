name: Format Markdown and LaTeX

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '.prettierrc.json'
      - '.github/workflows/format-markdown.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Format Markdown and embedded LaTeX
        run: npx --yes prettier@3.5.3 --write "**/*.md"

      - name: Apply Markdown fixes
        run: npx --yes markdownlint-cli2@0.17.2 --fix "**/*.md"

      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "No Markdown or LaTeX formatting changes are needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          git commit -m "chore: normalize Markdown and LaTeX formatting [skip ci]"
          git push
